name: sam3
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch>=2.4.0
      - torchvision
      - timm>=1.0.17
      - numpy>=1.26,<2
      - tqdm
      - ftfy==6.1.1
      - regex
      - iopath>=0.1.10
      - typing_extensions
      - huggingface_hub
      - einops
      - hydra-core
      - tensorboard
      - scipy
      - torchmetrics
      - fvcore
      - fairscale
      - scikit-image
      - scikit-learn
      - opencv-python
      - Pillow
      - pycocotools
      - matplotlib
      - wandb
      - transformers
      - yacs
      - addict
      - pyyaml
      - omegaconf
